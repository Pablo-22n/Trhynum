<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trhynum AO</title>

    <link rel="stylesheet" href="styles.css">

    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel&family=Uncial+Antiqua&display=swap" rel="stylesheet">
</head>

<body id="top">

    <!-- HEADER FUERA DEL HERO -->
    <header>
        <div class="header_logo">
            <img src="img/Logo.png" alt="Logo Trhynum AO">
        </div>

        <nav class="header__nav">
            <a href="#top">Inicio</a>
            <a href="#req-des">Descargas</a>
            <a href="#">Staff</a>
        </nav>
    </header>

    <!-- HERO -->
    <section class="hero-video">
        <video autoplay muted loop playsinline>
            <source src="video/fondo.mp4" type="video/mp4">
        </video>

        <div class="hero-content">
            <h1>Trhynum AO</h1>
        </div>
        <div class="scroll-indicator">
    &#x25BC;
</div>

    </section>

    <div id="req-des"></div>

    <h2 class="titulo-descargas">REQUISITOS Y DESCARGAS</h2>

    <div class="layout">
        <section class="requisitos">
            <div class="card">
                <h3>SO:</h3>
                <p>Windows 7, 8, 10 o superior (64 bits)</p>
            </div>
            <div class="card">
                <h3>ALMACENAMIENTO:</h3>
                <p>1GB Espacio Libre</p>
            </div>
            <div class="card">
                <h3>MEMORIA RAM:</h3>
                <p>2GB RAM</p>
            </div>
        </section>

        <section id="descargas">
            <div class="button">
                <a class="btn" href="#">
                    <img src="https://www.furiusao.com.ar/mediafire.png">
                    <span>Descarga Mediafire</span>
                </a>
            </div>
            <div class="button">
                <a class="btn btn--mega" href="#">
                    <img src="https://www.furiusao.com.ar/mega.png">
                    <span>Descarga Mega</span>
                </a>
            </div>
        </section>
    </div>

    <footer>
        <p>© 2026 - Trhynum AO</p>
    </footer>

</body>
</html>
